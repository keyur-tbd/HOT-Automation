name: Blinkit HOT Scheduler

on:
  # Run every 3 hours
  schedule:
    - cron: '34 */3 * * *'  # At minute 0 past every 3rd hour
  
  # Allow manual triggering
  workflow_dispatch:

jobs:
  run-workflow:
    runs-on: ubuntu-latest
    # Backstop only. The job's own --budget-minutes stops it first;
    # GitHub's default is 360 minutes, which let a stuck run keep
    # writing for 3h16m on 2026-08-31.
    timeout-minutes: 60
    
    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 2. Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip cache purge
          pip install numpy==1.24.3 --no-cache-dir
          pip install -r requirements.txt --no-cache-dir
      
      # 4. Restore Google credentials
      - name: Restore Google credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: |
          echo "$GOOGLE_CREDENTIALS" | base64 -d > credentials.json
          echo "$GOOGLE_TOKEN" | base64 -d > token.json
          echo "✅ Credentials restored"
      
      # 5. Run the workflow
      - name: Run workflow
        run: |
          echo "🚀 Starting Blinkit HOT workflow..."
          python app.py
      
      # Write the same Drive files to Supabase. Separate entry point from
      # the step above, which still writes to Google Sheets. --source is
      # explicit because .env is gitignored and the sink would otherwise
      # default to instamart.
      - name: Drive -> Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
        run: python -u supabase_sink.py --run --source hot --budget-minutes 45

      # 6. Cleanup
      - name: Cleanup credentials
        if: always()
        run: |
          rm -f credentials.json token.json
          echo "🧹 Cleaned up temporary files"
      
      # 7. Upload logs
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-logs-${{ github.run_number }}
          path: blinkit_scheduler.log
          retention-days: 30
